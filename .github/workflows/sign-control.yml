name: Sign Control Bundle & Deploy Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'control/**'
      - '.github/scripts/sign_control.py'
      - '.github/workflows/sign-control.yml'
      - 'index.html'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sign-control-bundle
  cancel-in-progress: false

jobs:
  sign:
    name: Validate & ECDSA Sign Control JSONs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sign & Verify Control Bundle
        env:
          ENOX_CONTROL_SIGNING_KEY: ${{ secrets.ENOX_CONTROL_SIGNING_KEY }}
        run: |
          python3 .github/scripts/sign_control.py

      - name: Commit Signed Control Envelope
        run: |
          git config user.name "enoxpay-control-bot"
          git config user.email "bot@enoxbd.local"
          git add dist/signed_control.json dist/revision.txt
          if git diff --cached --quiet; then
            echo "No changes to signed bundle."
          else
            REV="$(cat dist/revision.txt | tr -d '[:space:]')"
            git commit -m "chore(dist): sign control bundle rev ${REV} [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Package Static Control Files for Pages
        run: |
          mkdir -p _site/control _site/dist
          cp index.html _site/index.html
          cp control/*.json _site/control/
          cp dist/signed_control.json dist/revision.txt _site/dist/
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy Control JSONs to GitHub Pages
    needs: sign
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
